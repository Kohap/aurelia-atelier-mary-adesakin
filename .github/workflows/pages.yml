name: GitHub Pages (disabled)

# arteli.site is served by Vercel from this branch. GitHub Pages cannot host
# the TanStack Start SSR output (no `dist/` folder). Keep the workflow for a
# manual static experiment only — do not run on every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - name: Pages is not the live host
        run: echo "Live site is https://www.arteli.site/ on Vercel. Skipping Pages."
